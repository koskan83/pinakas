[package]
name = "grafida"
version = "0.1.0"
description = "PrismaBoard - διαδραστικός πίνακας"
edition = "2021"

[lib]
name = "grafida_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
xcap = "0.6"
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
