name: Android ψαλίδι (APK)

# Χτίζει τον βοηθό android-snip/ και τον ανεβάζει στο release «prismasnip»,
# ώστε ο διακόπτης στις Ρυθμίσεις να κατεβάζει πάντα την τελευταία έκδοση (βλ. SNIP_APK στο src/snip.ts).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android-snip/**', '.github/workflows/android-snip.yml']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.SIGNING_KEYSTORE_B64 != '' }}
    defaults:
      run:
        working-directory: android-snip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      # το Android SDK υπάρχει ήδη στο ubuntu-latest (ANDROID_HOME)· ό,τι λείπει το κατεβάζει το Gradle
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      # σταθερό κλειδί υπογραφής, ώστε κάθε νέα έκδοση να εγκαθίσταται πάνω στην παλιά
      - name: Signing key
        if: env.HAS_KEY == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "SIGNING_KEYSTORE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
      - run: gradle --no-daemon assembleRelease
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          SIGNING_ALIAS: ${{ secrets.SIGNING_ALIAS }}
      - run: mv app/build/outputs/apk/release/app-release.apk PrismaBoard-psalidi.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PrismaBoard-psalidi
          path: android-snip/PrismaBoard-psalidi.apk
      - name: Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view prismasnip >/dev/null 2>&1 || gh release create prismasnip --title "PrismaBoard ψαλίδι (Android)" \
            --notes "Βοηθός για το «Ψαλίδι πάνω από άλλες εφαρμογές» (☰ → Ρυθμίσεις και αρχεία). Ενημερώνεται αυτόματα σε κάθε αλλαγή του android-snip/." --latest=false
          gh release upload prismasnip PrismaBoard-psalidi.apk --clobber
